```yaml
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ansible/**
      - db/**
      - config/**
      - models/**
      - package.json
      - package-lock.json
      - server.js
      - .azure/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - ansible/**
      - db/**
      - config/**
      - models/**
      - package.json
      - package-lock.json
      - server.js
      - .azure/**

pool:
  name: SelfHostedPool

variables:
  - group: epicbook-production-secrets

  - name: ANSIBLE_DIR
    value: ansible

  - name: INVENTORY_FILE
    value: ansible/inventory/inventory.ini

stages:

# ============================================================
# Stage 1 - Prepare
# ============================================================
- stage: Prepare
  displayName: "Prepare"
  jobs:
    - job: PrepareAgent
      displayName: "Prepare Pipeline Agent"
      steps:

        - checkout: self
          clean: true

        - bash: |
            set -euo pipefail

            echo "Checking Python..."
            python3 --version

            echo "Checking Ansible..."
            if ! command -v ansible >/dev/null 2>&1; then
              echo "Ansible is not installed on the self-hosted agent."
              exit 1
            fi

            ansible --version

            echo "Checking required Ansible tools..."
            command -v ansible-playbook
            command -v ansible-inventory
          displayName: "Verify Python and Ansible"

        - bash: |
            set -euo pipefail

            echo "Installing only collections required by the playbook."

            # EpicBook currently uses only ansible.builtin modules.
            # Therefore no third-party collection is required.
            ansible-galaxy collection list || true

            echo "Required collection check completed."
          displayName: "Verify Required Ansible Collections"

        - task: DownloadSecureFile@1
          name: sshKey
          displayName: "Download SSH Private Key"
          inputs:
            secureFile: "id_ed25519"

        - bash: |
            set -euo pipefail

            chmod 600 "$(sshKey.secureFilePath)"

            echo "SSH key downloaded to the agent temporary directory."
            echo "Restrictive permissions applied."

            # Do not print the key or its contents.
            test -f "$(sshKey.secureFilePath)"
            test "$(stat -c '%a' "$(sshKey.secureFilePath)")" = "600"
          displayName: "Protect Temporary SSH Key"

# ============================================================
# Stage 2 - Validate
# ============================================================
- stage: Validate
  displayName: "Validate"
  dependsOn: Prepare
  condition: succeeded()
  jobs:
    - job: ValidateAnsible
      displayName: "Validate Ansible Configuration"
      steps:

        - checkout: self
          clean: true

        - task: DownloadSecureFile@1
          name: validationSshKey
          displayName: "Download SSH Key for Validation"
          inputs:
            secureFile: "id_ed25519"

        - bash: |
            set -euo pipefail

            chmod 600 "$(validationSshKey.secureFilePath)"

            echo "Validating Ansible inventory..."
            ansible-inventory \
              -i "$(INVENTORY_FILE)" \
              --graph

            echo "Running Ansible syntax check..."
            ansible-playbook \
              -i "$(INVENTORY_FILE)" \
              "$(ANSIBLE_DIR)/playbooks/site.yml" \
              --syntax-check
          displayName: "Validate Inventory and Syntax"

        - bash: |
            set -euo pipefail

            echo "Checking required non-sensitive handoff values..."

            test -n "$(ANSIBLE_DIR)"
            test -n "$(INVENTORY_FILE)"

            echo "Required pipeline configuration is present."
            echo "MySQL host and backend private IP are supplied through Ansible variables."
          displayName: "Validate Handoff Configuration"

        - bash: |
            set -euo pipefail

            if [ -z "${MYSQL_ADMIN_USERNAME:-}" ]; then
              echo "ERROR: MYSQL_ADMIN_USERNAME is not available."
              exit 1
            fi

            if [ -z "${MYSQL_ADMIN_PASSWORD:-}" ]; then
              echo "ERROR: MYSQL_ADMIN_PASSWORD is not available."
              exit 1
            fi

            echo "MYSQL_ADMIN_USERNAME is available."
            echo "MYSQL_ADMIN_PASSWORD is available."
            echo "Secret contents are not displayed."
          displayName: "Validate Secret Variables"
          env:
            MYSQL_ADMIN_USERNAME: $(MYSQL_ADMIN_USERNAME)
            MYSQL_ADMIN_PASSWORD: $(MYSQL_ADMIN_PASSWORD)

        - bash: |
            set -euo pipefail

            echo "SAFE FAILURE DRILL: intentional validation failure."
            echo "This failure is temporary and exists only on drill/pipeline-failure."
            exit 1
          displayName: "SAFE FAILURE DRILL - Intentional Validation Failure"

        - bash: |
            set -euo pipefail

            echo "Testing Ansible connectivity to frontend and backend..."

            ansible all \
              -i "$(INVENTORY_FILE)" \
              -m ping \
              --private-key "$(validationSshKey.secureFilePath)"
          displayName: "Test Ansible Connectivity"
          env:
            ANSIBLE_HOST_KEY_CHECKING: "true"

# ============================================================
# Stage 3 - Configure and Deploy
# ============================================================
- stage: Deploy
  displayName: "Configure and Deploy"
  dependsOn: Validate
  condition: succeeded()
  jobs:
    - job: DeployEpicBook
      displayName: "Deploy EpicBook with Ansible"
      steps:

        - checkout: self
          clean: true

        - task: DownloadSecureFile@1
          name: deploymentSshKey
          displayName: "Download SSH Key for Deployment"
          inputs:
            secureFile: "id_ed25519"

        - bash: |
            set -euo pipefail

            chmod 600 "$(deploymentSshKey.secureFilePath)"

            echo "Starting EpicBook Ansible deployment..."

            ansible-playbook \
              -i "$(INVENTORY_FILE)" \
              "$(ANSIBLE_DIR)/playbooks/site.yml" \
              --private-key "$(deploymentSshKey.secureFilePath)"
          displayName: "Run EpicBook Ansible Deployment"
          env:
            MYSQL_ADMIN_USERNAME: $(MYSQL_ADMIN_USERNAME)
            MYSQL_ADMIN_PASSWORD: $(MYSQL_ADMIN_PASSWORD)
            ANSIBLE_HOST_KEY_CHECKING: "true"

# ============================================================
# Stage 4 - Verify
# ============================================================
- stage: Verify
  displayName: "Verify"
  dependsOn: Deploy
  condition: succeeded()
  jobs:
    - job: VerifyEpicBook
      displayName: "Verify EpicBook Deployment"
      steps:

        - checkout: self
          clean: true

        - task: DownloadSecureFile@1
          name: verificationSshKey
          displayName: "Download SSH Key for Verification"
          inputs:
            secureFile: "id_ed25519"

        - bash: |
            set -euo pipefail

            chmod 600 "$(verificationSshKey.secureFilePath)"

            echo "Running final Ansible verification..."

            ansible-playbook \
              -i "$(INVENTORY_FILE)" \
              "$(ANSIBLE_DIR)/playbooks/site.yml" \
              --private-key "$(verificationSshKey.secureFilePath)"
          displayName: "Run Deployment Verification"
          env:
            MYSQL_ADMIN_USERNAME: $(MYSQL_ADMIN_USERNAME)
            MYSQL_ADMIN_PASSWORD: $(MYSQL_ADMIN_PASSWORD)
            ANSIBLE_HOST_KEY_CHECKING: "true"

        - bash: |
            set -euo pipefail

            echo "Checking frontend HTTP endpoint..."

            HTTP_STATUS="$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://20.98.101.42)"

            echo "Frontend HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "ERROR: EpicBook frontend did not return HTTP 200."
              exit 1
            fi

            echo "EpicBook frontend verification passed."
          displayName: "Verify Frontend HTTP Endpoint"
```
