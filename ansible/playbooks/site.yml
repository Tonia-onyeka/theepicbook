---
- name: Deploy EpicBook application
  hosts: all
  become: true
  gather_facts: true

  roles:
    - common

- name: Deploy EpicBook backend
  hosts: backend
  become: true
  gather_facts: true

  roles:
    - backend

- name: Deploy EpicBook frontend
  hosts: frontend
  become: true
  gather_facts: true

  roles:
    - frontend

- name: Verify EpicBook deployment
  hosts: frontend:backend
  become: true
  gather_facts: true

  roles:
    - verification
