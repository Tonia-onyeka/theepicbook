---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create frontend web root
  ansible.builtin.file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Ensure frontend port is defined
  ansible.builtin.assert:
    that:
      - frontend_port is defined
      - frontend_port | int > 0
    fail_msg: "The EpicBook frontend port is not configured correctly."

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Install EpicBook Nginx configuration
  ansible.builtin.template:
    src: epicbook-nginx.conf.j2
    dest: /etc/nginx/sites-available/epicbook
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable EpicBook Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook
    dest: /etc/nginx/sites-enabled/epicbook
    state: link
  notify: Reload Nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
